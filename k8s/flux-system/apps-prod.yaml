---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-prod
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/overlays/prod
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: data
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
