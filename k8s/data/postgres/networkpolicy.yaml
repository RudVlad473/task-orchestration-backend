# Admit TCP 5432 to Postgres only from the two app namespaces, the labelled postgres_exporter pod in
# monitoring and the labelled backup pod in kanban-data.
#
# Known holes:
# A node-local source (the CI SSH forward used by flyway-verify) matches neither peer; it relies on
# kube-router admitting node-originated traffic, which a NetworkPolicy does not govern.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - kanban-prod
                  - kanban-nonprod
        # The exporter peer is a SEPARATE list entry so its namespaceSelector and podSelector AND-combine;
        # folding it into the app-namespace entry would admit every labelled pod there, or every pod in
        # monitoring.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              kanban-board/postgres-client: "true"
        # The backup peer admits the labelled backup pod in kanban-data.
        #
        # It is a third, separate entry with a podSelector and no namespaceSelector, so it is limited to
        # this policy's own namespace and admits only pods carrying the label there, not the namespace's
        # other pods.
        - podSelector:
            matchLabels:
              kanban-board/postgres-client: "true"
      ports:
        - protocol: TCP
          port: 5432
