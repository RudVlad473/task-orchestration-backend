# Certificate for the architecture hostname, issued by letsencrypt-production. The site was served on
# letsencrypt-staging first and moved here in a later, separate commit, after its built output was
# reviewed. ClusterIssuers are in k8s/platform/edge/clusterissuers.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: architecture
spec:
  secretName: architecture-tls
  dnsNames:
    - kanban-board-rud-vlad-473-architecture.duckdns.org
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
