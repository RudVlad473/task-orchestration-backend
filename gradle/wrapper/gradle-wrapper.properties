distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip
# Pinned to the `bin` distribution's published SHA-256 (services.gradle.org, redirect-followed,
# cross-checked against downloads.gradle.org -- both agreed). Version-coupled: bumping
# distributionUrl to a new Gradle version without re-fetching and updating this value leaves the
# wrapper unable to run at all. Fix: re-fetch <new-version>-bin.zip.sha256 from the same endpoint.
distributionSha256Sum=21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
