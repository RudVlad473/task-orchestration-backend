# Committed-invariant checks, run on push AND pull_request; each job is a pure function of the commit.
#
# Decisions:
# deploy.yml triggers on `push: branches: [main]` ONLY and cannot take a `pull_request:` trigger without
# arming its deploy jobs on every PR, so a gate living there would fire only AFTER merge, where its only
# power is to leave `main` undeployed.
# A per-PR blocking run is safe because every job reads committed files (and, for k8s-manifests-valid,
# binaries pinned by sha256): an unchanged tree cannot newly fail days later the way security-scan.yml's
# advisory-driven verdict can.
# The trigger is an ordered `paths` list rather than `paths-ignore`: the instruction-budget guards are
# all *.md, which the old filter skipped. `.*/**` sits beside `**` because GitHub does not document
# whether `**` matches a dot-directory.
name: Invariant Checks

on:
  push:
    branches:
      - main
    # Ordered list, later entries override earlier ones: everything, minus inert docs and planning files,
    # with the always-loaded agent instruction files re-included because they are markdown too.
    # docs/architecture/ is re-included right after "!docs/**" because the model there is checked against the code.
    paths:
      - "**"
      - ".*/**"
      - "!docs/**"
      - "docs/architecture/**"
      - "!**/*.md"
      - "!.planning/**"
      - ".claude/**"
      - "**/CLAUDE.md"
      - "**/CLAUDE.local.md"
      - "**/AGENTS.md"
      - "**/GEMINI.md"
  pull_request:
    paths:
      - "**"
      - ".*/**"
      - "!docs/**"
      - "docs/architecture/**"
      - "!**/*.md"
      - "!.planning/**"
      - ".claude/**"
      - "**/CLAUDE.md"
      - "**/CLAUDE.local.md"
      - "**/AGENTS.md"
      - "**/GEMINI.md"

jobs:
  comment-lint:
    name: Code comments follow the documented policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install the gate's one dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Verify the gate's invariants can fire
        run: python3 scripts/verify-comments-selftest.py

      - name: Verify code-comment policy
        run: python3 scripts/verify-comments.py check

  instruction-budget:
    name: Always-loaded agent instruction files stay under their byte ceiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Runs ahead of the gate: a gate edited into something that cannot fire must be reported as the
      # failure here, not masked by a compliant tree.
      - name: Verify the gate's invariants can fire
        run: python3 scripts/verify-instruction-budget-selftest.py

      - name: Verify instruction-file budget
        run: python3 scripts/verify-instruction-budget.py

  public-dashboards:
    name: Public Grafana dashboards carry nothing the public renderer cannot resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install the gate's one dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      # Runs ahead of the gate, as in every job above.
      - name: Verify the gate's invariants can fire
        run: python3 scripts/verify-public-dashboards-selftest.py

      - name: Verify public dashboard invariants
        run: python3 scripts/verify-public-dashboards.py

  k8s-manifests-valid:
    name: Every k8s/ kustomization root validates against pinned Kubernetes/CRD schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # No separate install step: verify-k8s-manifests.sh downloads and sha256-verifies its own pinned
      # kubectl/kubeconform binaries on demand.
      - name: Verify k8s manifest invariants
        run: bash scripts/verify-k8s-manifests.sh

  k8s-invariants:
    name: k8s manifests carry only the edge as public, measured memory caps, no committed Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install the gate's one dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      # Runs ahead of the gate, as in every job above.
      - name: Verify the gate's invariants can fire
        run: python3 scripts/verify-k8s-invariants-selftest.py

      - name: Verify k8s invariants
        run: python3 scripts/verify-k8s-invariants.py --no-provisional

  pre-commit-secret-scan:
    name: The pre-commit secret scan reads the index every commit shape records
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The selftest pulls the hook's digest-pinned gitleaks image, so it stays a pure function of the commit.
      - name: Verify the hook scans the index git commit records
        run: python3 scripts/pre-commit-gitleaks-selftest.py

  likec4-model-drift:
    name: The LikeC4 model in docs/architecture still describes the code it is checked against
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # v6 is the first major that installs pnpm 11, and it reads the version from the packageManager field.
      # Trusted by tag like the other actions here: this job's token is read-only and the job holds no secrets,
      # and deploy.yml pins a non-GitHub action by digest only in a job whose token can write.
      - name: Install pnpm at the version the manifest pins
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/architecture/package.json

      - name: Install Node at the version the model was verified with
        uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'

      - name: Install the pinned LikeC4 tooling from the lockfile
        run: pnpm --dir docs/architecture install --frozen-lockfile

      # Runs ahead of the gate, as in every job above.
      - name: Verify the hook's LikeC4 step can fire
        run: python3 scripts/pre-commit-likec4-selftest.py

      - name: Verify the model matches the code
        run: node docs/architecture/sync.mjs check
