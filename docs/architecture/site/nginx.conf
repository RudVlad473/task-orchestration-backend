# Serves the static LikeC4 build with client-side routes answering 200 and a missing file answering 404.
#
# A path with a file extension is a file, so a miss is a real 404. Every extensionless path is a client route
# and gets the app shell.
#
# The assets location has no always on its Cache-Control header on purpose: an always would stamp immutable
# on the 404 of a missing asset, and a browser would then keep that failure for a year.
#
# Known limit: a route whose last segment holds a dot and has no trailing slash would hit the extension rule
# and answer 404. LikeC4 routes end in a slash and no view id has a dot today.
server {
    listen 8080;
    server_name _;
    root /srv/site;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
